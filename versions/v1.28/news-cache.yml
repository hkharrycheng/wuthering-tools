name: Update News Cache
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch official ArticleMenu and wrap
        run: |
          python - <<'EOF'
          import json, urllib.request, time, datetime
          url = "https://media-cdn-mingchao.kurogame.com/akiwebsite/website2.0/json/G152/zh/ArticleMenu.json?t=" + str(int(time.time() // 600))
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 Chrome/126.0"})
          data = json.load(urllib.request.urlopen(req, timeout=30))
          if not isinstance(data, list) or not data:
              raise SystemExit("unexpected payload")
          out = {"fetched_at": datetime.datetime.now().strftime("%Y-%m-%d %H:%M"), "articles": data}
          with open("news-cache.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(out, ensure_ascii=False))
          print("cached", len(data), "articles")
          EOF
      - name: Fetch official YouTube RSS and wrap
        run: |
          python - <<'EOF'
          import json, urllib.request, datetime, re
          url = "https://www.youtube.com/feeds/videos.xml?channel_id=UCVZqteUtWfSnwQ0ShjHixVw"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
          body = urllib.request.urlopen(req, timeout=30).read().decode("utf-8", "replace")
          entries = re.findall(r'<entry>(.*?)</entry>', body, re.S)
          videos = []
          for e in entries:
              m1 = re.search(r'<title>([^<]*)</title>', e)
              m2 = re.search(r'<link rel="alternate" href="([^"]+)"', e)
              m3 = re.search(r'<published>([^<]+)</published>', e)
              m4 = re.search(r'<yt:videoId>([^<]+)</yt:videoId>', e)
              if m1:
                  videos.append({"title": m1.group(1), "link": m2.group(1) if m2 else "", "published": m3.group(1) if m3 else "", "videoId": m4.group(1) if m4 else ""})
          out = {"fetched_at": datetime.datetime.now().strftime("%Y-%m-%d %H:%M"), "videos": videos}
          with open("youtube-news.json", "w", encoding="utf-8") as f:
              f.write(json.dumps(out, ensure_ascii=False))
          print("cached", len(videos), "videos")
          EOF
      - name: Commit and push
        run: |
          git config user.name "HIS Tools Bot"
          git config user.email "bot@users.noreply.github.com"
          git add news-cache.json youtube-news.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update news-cache.json [skip ci]"
            git push
          fi
